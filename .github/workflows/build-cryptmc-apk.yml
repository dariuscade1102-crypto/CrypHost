name: Build CryptMc APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "CryptMc/**"
      - ".github/workflows/build-cryptmc-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CryptMc

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure release signing when repository secrets are available
        if: ${{ env.RELEASE_STORE_B64 != '' }}
        env:
          RELEASE_STORE_B64: ${{ secrets.CRYPTMC_RELEASE_STORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.CRYPTMC_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.CRYPTMC_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.CRYPTMC_RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_STORE_B64" | base64 -d > keystore/cryptmc-release.keystore.jks
          {
            echo "CRYPTMC_RELEASE_STORE_FILE=keystore/cryptmc-release.keystore.jks"
            echo "CRYPTMC_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "CRYPTMC_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "CRYPTMC_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> gradle.properties

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cryptmc-release-apk
          path: CryptMc/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish build summary
        if: always()
        run: |
          {
            echo "## CryptMc Android build"
            echo
            echo "- Variant: release"
            echo "- APK path: \\`CryptMc/app/build/outputs/apk/release/app-release.apk\\`"
            echo "- Signing: release falls back to the debug keystore unless release keystore properties are configured."
            echo "- Runtime assets such as the embedded JRE and playit agent are not included in this source checkout."
          } >> "$GITHUB_STEP_SUMMARY"
