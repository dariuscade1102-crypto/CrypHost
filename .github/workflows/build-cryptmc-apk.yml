name: Build CryptMc APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "CryptMc/**"
      - ".github/workflows/build-cryptmc-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CryptMc

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cryptmc-debug-apk
          path: CryptMc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish build summary
        if: always()
        run: |
          {
            echo "## CryptMc Android build"
            echo
            echo "- Variant: debug"
            echo "- APK path: \\`CryptMc/app/build/outputs/apk/debug/app-debug.apk\\`"
            echo "- Runtime assets such as the embedded JRE and playit agent are not included in this source checkout."
          } >> "$GITHUB_STEP_SUMMARY"
