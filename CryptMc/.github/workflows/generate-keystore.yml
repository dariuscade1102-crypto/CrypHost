name: Generate release keystore (run manually, once)

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore password (you will need this every future release build)'
        required: true
      key_password:
        description: 'Key password (leave blank to reuse store password)'
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          KEY_PASS="${{ github.event.inputs.key_password }}"
          if [ -z "$KEY_PASS" ]; then KEY_PASS="${{ github.event.inputs.store_password }}"; fi
          keytool -genkeypair -v \
            -keystore cryptmc-release.keystore.jks \
            -alias cryptmc \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.store_password }}" -keypass "$KEY_PASS" \
            -dname "CN=CryptMc, OU=Dev, O=CryptMc, L=Unknown, ST=Unknown, C=US"

      - name: Base64-encode for easy secret storage
        run: base64 -w0 cryptmc-release.keystore.jks > cryptmc-release.keystore.jks.b64

      - name: Upload keystore (download this, then delete the run's artifact once saved safely)
        uses: actions/upload-artifact@v4
        with:
          name: cryptmc-release-keystore
          path: |
            cryptmc-release.keystore.jks
            cryptmc-release.keystore.jks.b64
